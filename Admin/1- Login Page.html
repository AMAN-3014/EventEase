<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login - EventEase</title><link rel="icon" href="../images/logo.svg"><link rel="stylesheet" href="../css/style.css"></head>
<body data-page="login" data-root="../"><div class="login"><form class="panel" id="loginForm"><h1>Admin login</h1>
<div class="field"><label for="u">Username</label><input id="u" name="user" autocomplete="username" required></div>
<div class="field"><label for="pw">Password</label><input id="pw" name="pass" type="password" autocomplete="current-password" required></div>
<div class="err" id="loginErr" role="alert"></div><button class="btn" style="width:100%" type="submit">Log in</button>
<p style="margin-top:1rem;font-size:.9rem;color:var(--mut)">Demo login: admin / admin123</p></form></div>
<script src="../js/data.js"></script><script src="../js/main.js"></script></body></html>
